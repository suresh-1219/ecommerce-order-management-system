# Active only when tests run with @ActiveProfiles("test").
# Uses an in-memory H2 database instead of MySQL, so integration tests are
# self-contained and don't depend on a running MySQL instance (locally or in CI).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dummy values — these endpoints aren't exercised by the auth integration test,
# but the properties must resolve for the application context to start.
jwt.secret=test-secret-key-for-integration-tests-only-not-for-production-use
jwt.expiration=3600000
jwt.refresh-expiration=604800000
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=dummy_secret
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=dummy

rate-limit.auth.capacity=1000