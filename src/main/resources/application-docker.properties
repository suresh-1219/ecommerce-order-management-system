# Active only when SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
# Overrides just the datasource host: inside the Docker network, MySQL is reachable
# at the service name "mysql" on its default port 3306 — the local port-3307 workaround
# in application.properties only exists because of a conflict on the host machine.
spring.datasource.url=jdbc:mysql://mysql:3306/ecommerce_db?createDatabaseIfNotExist=true
spring.data.redis.host=redis
spring.data.redis.port=6379
