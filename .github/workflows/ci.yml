name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit tests (Mockito, no DB needed) + the integration test (uses the "test"
      # profile, which points at an in-memory H2 database — no external MySQL required).
      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B package -DskipTests
